# =========================================================
# Default values for demo-app
# =========================================================

# how many pod copies to run (ignored if autoscaling is enabled)
replicaCount: 1

# which container image to use for the app
image:
  repository: nginx
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  tag: "1.27"
  # internal service (give a pod stable ip address inside the cluster)
service:
  type: ClusterIP
  port: 80
  targetPort: 80

# ingress configuration ( this will create an ALB and route traffic to the service)
ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
  path: /
  pathType: Prefix

# Horizonatal pod autoscaling configuration (scales based on CPU usage)
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80

# resources requests and limits for the pod. 
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# ServiceAccount (annotate for IRSA if the app needs AWS access)
serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# Health probes
probes:
  readiness:
    path: /
  liveness:
    path: /
  # This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http
  # Additional volumes on the output Deployment definition.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
